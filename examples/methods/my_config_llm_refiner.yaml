# Default config for running the LLM refiner (Llama3-8B-Instruct) with vLLM generation.

model2path:
  e5: "/data/user_data/hanzhanz/models/e5-base-v2"
  bge: "BAAI/bge-base-en-v1.5"
  contriever: "facebook/contriever"
  llama2-7B-chat: "meta-llama/Llama-2-7b-chat-hf"
  llama2-7B: "meta-llama/Llama-2-7b-hf"
  llama2-13B: "meta-llama/Llama-2-13b-hf"
  llama2-13B-chat: "meta-llama/Llama-2-13b-chat-hf"
  llama3-8B-instruct: "/data/user_data/hanzhanz/models/llama3-8b-instruct"

model2pooling:
  e5: "mean"
  bge: "cls"
  contriever: "mean"
  jina: "mean"
  dpr: cls

method2index:
  e5: /data/user_data/hanzhanz/flashrag_datasets/retrieval-corpus/indexes/e5_Flat.index
  bm25: ~
  contriever: ~

data_dir: "/data/user_data/hanzhanz/flashrag_datasets/"
save_dir: "output/"

gpu_id: "0,1,2,3"
dataset_name: "nq"
split: [ "test" ]

test_sample_num: ~
random_sample: False
seed: 2024
save_intermediate_data: True
save_note: "llm-refiner"

retrieval_method: "e5"
index_path: /data/user_data/hanzhanz/flashrag_datasets/retrieval-corpus/indexes/e5_Flat.index
faiss_gpu: False
corpus_path: /data/user_data/hanzhanz/flashrag_datasets/retrieval-corpus/wiki18_100w.jsonl
instruction: ~
retrieval_topk: 5
retrieval_batch_size: 256
retrieval_use_fp16: True
retrieval_query_max_length: 128
save_retrieval_cache: False
use_retrieval_cache: False
retrieval_cache_path: ~
retrieval_pooling_method: ~

use_reranker: False
rerank_model_name: ~
rerank_model_path: ~
rerank_pooling_method: ~
rerank_topk: 5
rerank_max_length: 512
rerank_batch_size: 256
rerank_use_fp16: True

framework: vllm
generator_model: "llama3-8B-instruct"
generator_max_input_len: 2048
generator_batch_size: 2
generation_params:
  do_sample: False
  max_tokens: 32
use_fid: False

refiner_name: "llm-refiner"
refiner_model_path: "mistralai/Mistral-7B-Instruct-v0.2"
refiner_max_input_length: 1024
refiner_max_output_length: 384
refiner_batch_size: 1
refiner_device: "cuda:0"
refiner_torch_dtype: "float16"
lazy_load_generator: True
lazy_load_refiner: True
release_retriever_after_search: True

llmlingua_config:
  rate: 0.55
  condition_in_question: "after_condition"
  reorder_context: "sort"
  dynamic_context_compression_ratio: 0.3
  condition_compare: True
  context_budget: "+100"
  rank_method: "longllmlingua"
sc_config:
  "reduce_ratio": 0.5

metrics: [ "em","f1","acc","precision","recall" ]
metric_setting:
  retrieval_recall_topk: 5
save_metric_score: True
